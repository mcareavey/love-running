<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Meta Description-->
    <meta name="description"
        content="Love Running is a community for runners of all levels to share their passion for running.">
    <meta name="keywords" content="love running, club, Dublin, running, community, fitness, health, marathon, training">
    <!--Title -->
    <title>Love Running</title>
    <!--Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <!--CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!--Header Section-->
    <header>
        <a href="index.html">
            <h1 id="logo">Love Running</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signup.html" class="active">Sign-Up</a></li>
            </ul>
        </nav>
    </header>

    <!--Main Content-->
    <main>
        <section id="signup">
            <form method="POST" action="https://formdump.codeinstitute.net" id="signup-form">
                <h2><i class="fa-solid fa-heart-pulse"></i>Let's get you signed up!</h2>

                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required><br>

                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required><br>

                <label for="email_address">Email Address</label>
                <input type="text" id="email_address" name="email_address" required><br>

                <div class="radio_buttons">
                    <div id="road">
                        <label for="road_button">Road</label>
                        <input type="radio" id="road_button" name="running_preference" value="road" checked>
                    </div>
                    <div id="trail">
                        <label for="trail_button">Trail</label>
                        <input type="radio" id="trail_button" name="running_preference" value="trail">
                    </div>
                    <div id="both">
                        <label for="both_button">Both</label>
                        <input type="radio" id="both_button" name="running_preference" value="both">
                    </div>
                    <button type="submit">Let's Run!</button>
                </div>
            </form>
        </section>
    </main>

    <!--Footer Section-->
    <footer>
        <ul id="social-media">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in a new tab)"><i class="fa-brands fa-facebook"></i></a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in a new tab)"><i
                        class="fa-brands fa-square-instagram"></i></a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Twitter page (opens in a new tab)"><i class="fa-brands fa-twitter"></i></a>
            </li>
            <li>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener"
                    aria-label="Visit our LinkedIn page (opens in a new tab)"><i class="fa-brands fa-linkedin"></i></a>
            </li>
        </ul>
    </footer>
    <script src="https://kit.fontawesome.com/5ec5e6d1dd.js" crossorigin="anonymous"></script>
</body>

</html>
